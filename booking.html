<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - MabarStation</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-bg: #050510;
            --text-color: #f3f4f6;
            --glass-bg: rgba(10, 15, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-cyan: #38bdf8;
            --neon-green: #34d399;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5 { 
            font-family: 'Orbitron', sans-serif; 
            font-weight: 700; 
            color: #fff; 
        }

        .navbar-custom {
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #fff !important;
        }

        .glass-input:focus {
            border-color: var(--neon-cyan) !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4) !important;
        }

        .glass-input option {
            background-color: var(--dark-bg);
            color: #fff;
        }
        
        .glass-input::placeholder {
            color: rgba(255,255,255,0.4) !important;
        }

        .btn-cyber {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            width: 100%;
            cursor: pointer;
        }

        .btn-cyber:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .text-glow-cyan { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(56,189,248,0.3); }
    </style>
</head>
<body>

    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-custom py-3">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center text-white text-decoration-none" href="index.html" style="font-family: 'Orbitron', sans-serif;">
                    ← Kembali
                </a>
            </div>
        </nav>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <div class="text-center mb-4">
                    <h2 class="text-glow-cyan" style="font-family: 'Orbitron', sans-serif;">Form Pendaftaran Rental</h2>
                </div>

                <div class="glass-panel">
                    <form action="#">
                        <div class="mb-3">
                            <label class="form-label text-light opacity-75">Username:</label>
                            <input type="text" name="username" required class="form-control glass-input" placeholder="Nama">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light opacity-75">Telepon:</label>
                            <input type="text" name="telepon" required class="form-control glass-input" placeholder="+62">
                        </div>

                        <div class="row mb-3">
                            <div class="col-sm-6 mb-3 mb-sm-0">
                                <label class="form-label text-light opacity-75">Pilih Tanggal:</label>
                                <input type="date" name="date" required class="form-control glass-input">
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-light opacity-75">Pilih Jam Mulai:</label>
                                <input type="time" name="time" required class="form-control glass-input">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light opacity-75">Lama Main (Jam):</label>
                            <input type="number" name="durasi" min="1" max="12" required class="form-control glass-input" placeholder="1">
                        </div>

                        <div class="row mb-3">
                            <div class="col-sm-6 mb-3 mb-sm-0">
                                <label class="form-label text-light opacity-75">Pilih PlayStation:</label>
                                <select name="playstation" class="form-select glass-input">
                                    <option value="PS3">PS3</option>
                                    <option value="PS4">PS4</option>
                                    <option value="PS5">PS5</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-light opacity-75">Pilih Ruangan:</label>
                                <select name="room" required class="form-select glass-input">
                                    <option value="regular">Regular</option>
                                    <option value="VIP">VIP</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light opacity-75">Catatan:</label>
                            <textarea name="message" rows="3" class="form-control glass-input" placeholder="Catatan opsional..."></textarea>
                        </div>

                        <button type="submit" class="btn-cyber mb-4">
                            Submit Booking
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
